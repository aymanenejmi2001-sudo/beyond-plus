# Render Blueprint : héberge le site Next.js (dossier storefront/) sur l'offre gratuite.
# Les secrets ne sont jamais dans ce fichier : Render les demande à la création (sync: false).
services:
  - type: web
    name: beyond-plus
    runtime: node
    plan: free
    region: frankfurt
    rootDir: storefront
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /robots.txt
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://beyondplusmaroc.com
      - key: NEXT_PUBLIC_SITE_STATUS
        value: live
      - key: SMTP_PASSWORD
        sync: false
      - key: REPORT_TOKEN
        sync: false
      - key: RADAR_ADMIN_PASSWORD
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
